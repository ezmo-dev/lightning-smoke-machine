<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lightning Smoke Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- Screen 1: Language Select -->
    <div id="screen-language" class="screen active">

      <!-- Row 1: background shape + logo layered on top -->
      <div class="lang-hero">
        <img src="img/screen-01/background-screen-01.svg" alt="" class="lang-bg" />
        <img src="img/screen-01/logo.svg" alt="Smoke Machine" class="lang-logo" />
      </div>

      <!-- Row 2: text, pulled up to straddle the blob edge -->
      <div class="lang-text">
        <p class="lang-tagline">YOUR FIRST LIGHTNING-POWERED DEVICE STARTS HERE!</p>
        <p class="lang-subtitle">Choose your language</p>
      </div>

      <!-- Row 3: buttons -->
      <div class="lang-buttons">
        <button id="btn-fr" class="btn-lang btn-lang--primary">FR</button>
        <button id="btn-en" class="btn-lang btn-lang--outline">EN</button>
      </div>

    </div>

    <!-- Screen 2a: Welcome (first visit) -->
    <div id="screen-welcome" class="screen">

      <!-- Row 1: halo + logo + caterpillar layered -->
      <div class="welcome-hero">
        <img src="img/screen-02a/background-screen-02a.svg" alt="" class="welcome-bg" />
        <img src="img/screen-02a/logo.svg" alt="Smoke Machine" class="welcome-logo" />
        <img src="img/mascot/level-00.png" alt="" class="welcome-mascot" />
      </div>

      <!-- Row 2: form inputs -->
      <div class="welcome-form">
        <input
          id="input-pseudonym"
          type="text"
          class="pseudonym-input"
          placeholder="What should we call you, builder?..."
          maxlength="20"
          autocomplete="off"
        />
        <button id="btn-letsgo" class="btn-letsgo">LET'S GO!</button>
        <p class="welcome-info">*Use the same browser to keep your progress</p>
      </div>

    </div>

    <!-- Screen 2b: Welcome Back (returning user) -->
    <div id="screen-welcome-back" class="screen">

      <!-- Top bar: profile + help icons -->
      <div class="wb-topbar">
        <button id="btn-wb-profile" class="wb-icon-btn" aria-label="Profile">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="9" r="5" stroke="#191817" stroke-width="2"/>
            <path d="M4 24c0-5.523 4.477-10 10-10s10 4.477 10 10" stroke="#191817" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="btn-wb-help" class="wb-icon-btn" aria-label="Help">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="12" stroke="#191817" stroke-width="2"/>
            <text x="14" y="19" text-anchor="middle" font-family="Quicksand, sans-serif" font-size="14" font-weight="700" fill="#191817">?</text>
          </svg>
        </button>
      </div>

      <!-- Hero: halo background + logo + caterpillar layered -->
      <div class="wb-hero">
        <img src="img/screen-02b/background-screen-02b.svg" alt="" class="wb-bg" />
        <img src="img/screen-02b/logo.svg" alt="Smoke Machine" class="wb-logo" />
        <img id="wb-mascot" src="img/mascot/level-00.png" alt="" class="wb-mascot" />
      </div>

      <!-- Bottom zone: welcome text, progress, buttons -->
      <div class="wb-bottom">
        <p class="wb-greeting">Welcome back <span id="wb-pseudonym"></span>!</p>
        <div class="wb-progress-bar">
          <div id="wb-progress-fill" class="wb-progress-fill"></div>
        </div>
        <p id="wb-progress-text" class="wb-progress-text">Step 0 of 14 completed</p>
        <div class="wb-buttons">
          <button id="btn-continue" class="btn-lang btn-lang--primary">CONTINUE</button>
          <button id="btn-startover" class="btn-lang btn-lang--outline">START OVER</button>
        </div>
      </div>

    </div>

    <!-- Screen 3: Tutorial Map -->
    <div id="screen-map" class="screen">
      <h2>Tutorial Map</h2>
    </div>

    <!-- Screen 4: Step Content -->
    <div id="screen-step" class="screen">
      <h2>Step Content</h2>
    </div>

    <!-- Screen 4b: Safety Warning -->
    <div id="screen-safety" class="screen">
      <h2>Safety Warning</h2>
    </div>

    <!-- Screen 5: Level Up -->
    <div id="screen-levelup" class="screen">
      <h2>Level Up</h2>
    </div>

    <!-- Screen 6: Help Center -->
    <div id="screen-help" class="screen">
      <h2>Help Center</h2>
    </div>

    <!-- Screen 7: Profile / Stats -->
    <div id="screen-profile" class="screen">
      <h2>Profile / Stats</h2>
    </div>

  </div><!-- /#app -->

  <script src="js/app.js"></script>
</body>
</html>
