<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lightning Smoke Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- Screen 1: Language Select -->
    <div id="screen-language" class="screen active">

      <!-- Row 1: background shape + logo layered on top -->
      <div class="lang-hero">
        <img src="img/screen-01/background-screen-01.svg" alt="" class="lang-bg" />
        <img src="img/screen-01/logo.svg" alt="Smoke Machine" class="lang-logo" />
      </div>

      <!-- Row 2: text, pulled up to straddle the blob edge -->
      <div class="lang-text">
        <p class="lang-tagline">YOUR FIRST LIGHTNING-POWERED DEVICE STARTS HERE!</p>
        <p class="lang-subtitle">Choose your language</p>
      </div>

      <!-- Row 3: buttons -->
      <div class="lang-buttons">
        <button id="btn-fr" class="btn-lang btn-lang--primary">FR</button>
        <button id="btn-en" class="btn-lang btn-lang--outline">EN</button>
      </div>

    </div>

    <!-- Screen 2a: Welcome (first visit) -->
    <div id="screen-welcome" class="screen">
      <h2>Welcome (first visit)</h2>
    </div>

    <!-- Screen 2b: Welcome Back (returning user) -->
    <div id="screen-welcome-back" class="screen">
      <h2>Welcome back</h2>
    </div>

    <!-- Screen 3: Tutorial Map -->
    <div id="screen-map" class="screen">
      <h2>Tutorial Map</h2>
    </div>

    <!-- Screen 4: Step Content -->
    <div id="screen-step" class="screen">
      <h2>Step Content</h2>
    </div>

    <!-- Screen 4b: Safety Warning -->
    <div id="screen-safety" class="screen">
      <h2>Safety Warning</h2>
    </div>

    <!-- Screen 5: Level Up -->
    <div id="screen-levelup" class="screen">
      <h2>Level Up</h2>
    </div>

    <!-- Screen 6: Help Center -->
    <div id="screen-help" class="screen">
      <h2>Help Center</h2>
    </div>

    <!-- Screen 7: Profile / Stats -->
    <div id="screen-profile" class="screen">
      <h2>Profile / Stats</h2>
    </div>

  </div><!-- /#app -->

  <script src="js/app.js"></script>
</body>
</html>
