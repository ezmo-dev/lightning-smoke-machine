<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lightning Smoke Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- Screen 1: Language Select -->
    <div id="screen-language" class="screen">
      <div class="lang-logo-area">
        <div class="logo-placeholder"></div>
      </div>
      <div class="lang-buttons">
        <button id="btn-fr" class="btn-lang">FR</button>
        <button id="btn-en" class="btn-lang">EN</button>
      </div>
    </div>

    <!-- Screen 2a: Welcome (first visit) -->
    <div id="screen-welcome" class="screen">
      <h2>Welcome (first visit)</h2>
    </div>

    <!-- Screen 2b: Welcome Back (returning user) -->
    <div id="screen-welcome-back" class="screen">
      <h2>Welcome back</h2>
    </div>

    <!-- Screen 3: Tutorial Map -->
    <div id="screen-map" class="screen">
      <h2>Tutorial Map</h2>
    </div>

    <!-- Screen 4: Step Content -->
    <div id="screen-step" class="screen">
      <h2>Step Content</h2>
    </div>

    <!-- Screen 4b: Safety Warning -->
    <div id="screen-safety" class="screen">
      <h2>Safety Warning</h2>
    </div>

    <!-- Screen 5: Level Up -->
    <div id="screen-levelup" class="screen">
      <h2>Level Up</h2>
    </div>

    <!-- Screen 6: Help Center -->
    <div id="screen-help" class="screen">
      <h2>Help Center</h2>
    </div>

    <!-- Screen 7: Profile / Stats -->
    <div id="screen-profile" class="screen">
      <h2>Profile / Stats</h2>
    </div>

  </div><!-- /#app -->

  <script src="js/app.js"></script>
</body>
</html>
